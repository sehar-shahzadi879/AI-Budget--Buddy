<!DOCTYPE html>
<html>
<head>
<title>AI Budget Buddy</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 700px;
    margin: auto;
}

h1 {
    text-align: center;
    color: white;
    font-size: 32px;
}

.subtitle {
    text-align: center;
    color: white;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 22px;
    margin-bottom: 20px;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.18);
}

h2 {
    color: #333;
}

input {
    width: 100%;
    padding: 13px;
    margin: 6px 0;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    border: none;
    border-radius: 10px;
    background: #667eea;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

#budgetAlert,
#suggestion,
#goalMessage {
    padding: 12px;
    border-radius: 10px;
    line-height: 1.5;
}

#budgetAlert {
    background: #eef2ff;
    text-align: center;
}

#suggestion {
    background: #fff8df;
}

#goalMessage {
    background: #eefbf3;
}

.progress-container {
    width: 100%;
    background: #eeeeee;
    border-radius: 12px;
    overflow: hidden;
    margin-top: 12px;
}

#savingsProgress {
    width: 0%;
    background: #667eea;
    color: white;
    text-align: center;
    padding: 9px 0;
    font-weight: bold;
    transition: width 0.5s;
}

ul {
    padding: 0;
    list-style: none;
}

li {
    background: #f5f5f5;
    margin: 8px 0;
    padding: 12px;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

li button {
    width: auto;
    margin: 0;
    padding: 7px 12px;
    font-size: 13px;
}

.reset-button {
    background: #e74c3c;
}

canvas {
    max-width: 100%;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="container">

<h1>💰 AI Budget Buddy</h1>

<p class="subtitle">
Smartly manage your daily expenses, budget and savings.
</p>


<div class="card">

<h2>💰 My Budget</h2>

<input type="number" id="budget" placeholder="Enter your budget">

<button onclick="setBudget()">Set Budget</button>

<p>Budget: <strong>Rs. <span id="budgetAmount">0</span></strong></p>

<p>Spent: <strong>Rs. <span id="totalSpent">0</span></strong></p>

<p>Remaining: <strong>Rs. <span id="remaining">0</span></strong></p>

<h3 id="budgetAlert"></h3>

</div>


<div class="card">

<h2>🎯 Savings Goal</h2>

<input type="number" id="savingsGoal" placeholder="Enter savings goal">

<button onclick="setSavingsGoal()">Set Savings Goal</button>

<p id="goalMessage">No savings goal set yet.</p>

<div class="progress-container">
    <div id="savingsProgress">0%</div>
</div>

</div>


<div class="card">

<h2>💸 Daily Expense Tracker</h2>

<input type="number" id="expense" placeholder="Enter amount">

<input type="text" id="category" placeholder="Food, Travel, Books">

<button onclick="addExpense()">Add Expense</button>

<h3>My Expenses</h3>

<ul id="expenseList"></ul>

<p id="suggestion"></p>

</div>


<div class="card">

<h2>📊 Expense Chart</h2>

<canvas id="expenseChart"></canvas>

</div>


<div class="card">

<h2>⚙️ App Controls</h2>

<button class="reset-button" onclick="resetData()">
🗑️ Reset All Data
</button>

</div>

</div>


<script>

let budget = Number(localStorage.getItem("budget")) || 0;

let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

let savingsGoal = Number(localStorage.getItem("savingsGoal")) || 0;

let expenseChart = null;


function saveData() {

localStorage.setItem("budget", budget);

localStorage.setItem("expenses", JSON.stringify(expenses));

localStorage.setItem("savingsGoal", savingsGoal);

}


function setBudget() {

let value = Number(document.getElementById("budget").value);

if (value <= 0) {

alert("Please enter a valid budget.");

return;

}

budget = value;

saveData();

updateScreen();

}


function setSavingsGoal() {

let value = Number(document.getElementById("savingsGoal").value);

if (value <= 0) {

alert("Please enter a valid savings goal.");

return;

}

savingsGoal = value;

saveData();

updateScreen();

}


function addExpense() {

let amount = Number(document.getElementById("expense").value);

let category = document.getElementById("category").value.trim();

if (amount <= 0 || category === "") {

alert("Please enter expense amount and category.");

return;

}

expenses.push({

amount: amount,

category: category

});

saveData();

document.getElementById("expense").value = "";

document.getElementById("category").value = "";

updateScreen();

}


function deleteExpense(index) {

expenses.splice(index, 1);

saveData();

updateScreen();

}


function resetData() {

let confirmReset = confirm(
"Are you sure you want to delete all budget, expense and savings data?"
);

if (!confirmReset) {

return;

}

budget = 0;

expenses = [];

savingsGoal = 0;

saveData();

document.getElementById("budget").value = "";

document.getElementById("savingsGoal").value = "";

updateScreen();

}


function updateScreen() {

document.getElementById("budgetAmount").textContent = budget;


let totalSpent = 0;

expenses.forEach(function(expense) {

totalSpent += expense.amount;

});


document.getElementById("totalSpent").textContent = totalSpent;


let remaining = budget - totalSpent;

document.getElementById("remaining").textContent = remaining;


let alertBox = document.getElementById("budgetAlert");


if (budget <= 0) {

alertBox.textContent =
"💰 Please set your budget.";

}

else {

let percentage = (totalSpent / budget) * 100;


if (percentage > 100) {

alertBox.textContent =
"🚨 Budget exceeded! Please reduce your spending.";

}

else if (percentage >= 80) {

alertBox.textContent =
"⚠️ Warning! You have used " +
Math.round(percentage) +
"% of your budget.";

}

else {

alertBox.textContent =
"✅ You're on track! You have used " +
Math.round(percentage) +
"% of your budget.";

}

}


let list = document.getElementById("expenseList");

list.innerHTML = "";


expenses.forEach(function(expense, index) {

let item = document.createElement("li");

item.innerHTML =
expense.category +
" - Rs. " +
expense.amount +
' <button onclick="deleteExpense(' +
index +
')">Delete</button>';

list.appendChild(item);

});


/* 🤖 Smart Personalized Recommendation */

if (budget <= 0) {

document.getElementById("suggestion").textContent =
"🤖 Smart Suggestion: Set a budget first to receive personalized spending advice.";

}

else if (remaining < 0) {

document.getElementById("suggestion").textContent =
"🚨 Smart Alert: Your spending is above your budget. Try reducing unnecessary expenses.";

}

else {

let percentage = (totalSpent / budget) * 100;

if (percentage >= 80) {

document.getElementById("suggestion").textContent =
"🤖 Smart Suggestion: You have used " +
Math.round(percentage) +
"% of your budget. Try to limit extra spending and focus on essential expenses.";

}

else if (percentage >= 50) {

document.getElementById("suggestion").textContent =
"🤖 Smart Suggestion: You have used " +
Math.round(percentage) +
"% of your budget. Keep tracking your expenses to stay on budget.";

}

else if (expenses.length > 0) {

document.getElementById("suggestion").textContent =
"🤖 Smart Suggestion: Your spending is under control. You have Rs. " +
remaining +
" remaining. Consider saving part of it.";

}

else {

document.getElementById("suggestion").textContent =
"🤖 Smart Suggestion: Start adding your expenses to receive personalized spending advice.";

}

}


/* 🎯 Savings Progress */

let progress = 0;

if (savingsGoal > 0 && remaining > 0) {

progress = (remaining / savingsGoal) * 100;

if (progress > 100) {

progress = 100;

}

}

let progressBar = document.getElementById("savingsProgress");

progressBar.style.width = progress + "%";

progressBar.textContent = Math.round(progress) + "%";


if (savingsGoal <= 0) {

document.getElementById("goalMessage").textContent =
"No savings goal set yet.";

}

else if (remaining >= savingsGoal) {

document.getElementById("goalMessage").textContent =
"🎉 Great! You can reach your savings goal of Rs. " +
savingsGoal +
".";

}

else {

let needed = savingsGoal - Math.max(remaining, 0);

document.getElementById("goalMessage").textContent =
"🎯 Savings Goal: Rs. " +
savingsGoal +
". You need Rs. " +
needed +
" more to reach your goal.";

}


updateChart();

}


function updateChart() {

let totals = {};


expenses.forEach(function(expense) {

if (totals[expense.category]) {

totals[expense.category] += expense.amount;

}

else {

totals[expense.category] = expense.amount;

}

});


let labels = Object.keys(totals);

let data = Object.values(totals);

let ctx = document.getElementById("expenseChart");


if (expenseChart) {

expenseChart.destroy();

}


if (labels.length === 0) {

return;

}


expenseChart = new Chart(ctx, {

type: "doughnut",

data: {

labels: labels,

datasets: [{

data: data

}]

},

options: {

responsive: true

}

});

}


document.getElementById("budget").value = budget || "";

document.getElementById("savingsGoal").value = savingsGoal || "";

updateScreen();

</script>

</body>
</html>
