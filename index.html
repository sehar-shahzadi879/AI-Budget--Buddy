<!DOCTYPE html>
<html>
<head>
    <title>AI Budget Buddy</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

    <h1>💰 AI Budget Buddy</h1>

    <p class="subtitle">
        Smartly manage your daily expenses, budget and savings.
    </p>

    <div class="card">

        <h2>My Budget</h2>

        <input type="number" id="budget" placeholder="Enter your budget">

        <button onclick="setBudget()">Set Budget</button>

        <div class="summary">

            <p>Budget:
                <strong>Rs. <span id="budgetAmount">0</span></strong>
            </p>

            <p>Spent:
                <strong>Rs. <span id="totalSpent">0</span></strong>
            </p>

            <p>Remaining:
                <strong>Rs. <span id="remaining">0</span></strong>
            </p>

        </div>

    </div>


    <div class="card">

        <h2>🎯 Savings Goal</h2>

        <input
            type="number"
            id="savingsGoal"
            placeholder="Enter savings goal"
        >

        <button onclick="setSavingsGoal()">
            Set Savings Goal
        </button>

        <p id="goalMessage">
            No savings goal set yet.
        </p>

    </div>


    <div class="card">

        <h2>Daily Expense Tracker</h2>

        <input
            type="number"
            id="expense"
            placeholder="Enter amount"
        >

        <input
            type="text"
            id="category"
            placeholder="Food, Travel, etc."
        >

        <button onclick="addExpense()">
            Add Expense
        </button>

        <h3>My Expenses</h3>

        <ul id="expenseList"></ul>

        <div id="suggestion" class="suggestion"></div>

    </div>


    <div class="card">

        <h2>📊 Expense Chart</h2>

        <canvas id="expenseChart"></canvas>

    </div>

</div>


<script>

let budget =
    Number(localStorage.getItem("budget")) || 0;

let expenses =
    JSON.parse(localStorage.getItem("expenses")) || [];

let savingsGoal =
    Number(localStorage.getItem("savingsGoal")) || 0;

let expenseChart;


function saveData() {

    localStorage.setItem("budget", budget);

    localStorage.setItem(
        "expenses",
        JSON.stringify(expenses)
    );

    localStorage.setItem(
        "savingsGoal",
        savingsGoal
    );

}


function setBudget() {

    const value =
        Number(document.getElementById("budget").value);

    if (value <= 0) {

        alert("Please enter a valid budget.");

        return;
    }

    budget = value;

    saveData();

    updateScreen();

}


function setSavingsGoal() {

    const value =
        Number(
            document.getElementById("savingsGoal").value
        );

    if (value <= 0) {

        alert("Please enter a valid savings goal.");

        return;
    }

    savingsGoal = value;

    saveData();

    updateScreen();

}


function addExpense() {

    const amount =
        Number(document.getElementById("expense").value);

    const category =
        document.getElementById("category").value.trim();


    if (amount <= 0 || category === "") {

        alert(
            "Please enter expense amount and category."
        );

        return;
    }


    expenses.push({

        amount: amount,

        category: category

    });


    saveData();


    document.getElementById("expense").value = "";

    document.getElementById("category").value = "";


    updateScreen();

}


function deleteExpense(index) {

    expenses.splice(index, 1);

    saveData();

    updateScreen();

}


function showSuggestion() {

    const suggestion =
        document.getElementById("suggestion");


    const totalSpent =
        expenses.reduce(
            function(total, expense) {

                return total + expense.amount;

            },
            0
        );


    const remaining =
        budget - totalSpent;


    if (budget <= 0) {

        suggestion.textContent =
            "💡 Set a budget to get smart saving suggestions.";

    }

    else if (remaining < 0) {

        suggestion.textContent =
            "⚠️ You have exceeded your budget. Try to reduce unnecessary expenses.";

    }

    else if (remaining <= budget * 0.2) {

        suggestion.textContent =
            "⚠️ Your budget is almost finished. Try to control your spending.";

    }

    else {

        suggestion.textContent =
            "💡 Great! You have Rs. " +
            remaining +
            " remaining. Keep saving and avoid unnecessary expenses.";

    }

}


function updateGoal() {

    const goalMessage =
        document.getElementById("goalMessage");


    if (savingsGoal <= 0) {

        goalMessage.textContent =
            "No savings goal set yet.";

        return;

    }


    const totalSpent =
        expenses.reduce(
            function(total, expense) {

                return total + expense.amount;

            },
            0
        );


    const remaining =
        budget - totalSpent;


    if (remaining >= savingsGoal) {

        goalMessage.textContent =
            "🎉 Great! You can reach your savings goal of Rs. " +
            savingsGoal +
            " with your remaining budget.";

    }

    else {

        const needed =
            savingsGoal - Math.max(remaining, 0);

        goalMessage.textContent =
            "🎯 Savings Goal: Rs. " +
            savingsGoal +
            ". You need Rs. " +
            needed +
            " more to reach it.";

    }

}


function updateChart() {

    const categoryTotals = {};


    expenses.forEach(function(expense) {

        if (categoryTotals[expense.category]) {

            categoryTotals[expense.category] +=
                expense.amount;

        }

        else {

            categoryTotals[expense.category] =
                expense.amount;

        }

    });


    const labels =
        Object.keys(categoryTotals);

    const data =
        Object.values(categoryTotals);


    const ctx =
        document.getElementById("expenseChart");


    if (expenseChart) {

        expenseChart.destroy();

    }


    expenseChart = new Chart(ctx, {

        type: "doughnut",

        data: {

            labels: labels,

            datasets: [{

                data: data

            }]

        },

        options: {

            responsive: true

        }

    });

}


function updateScreen() {

    document.getElementById("budgetAmount").textContent =
        budget;


    const totalSpent =
        expenses.reduce(
            function(total, expense) {

                return total + expense.amount;

            },
            0
        );


    document.getElementById("totalSpent").textContent =
        totalSpent;


    document.getElementById("remaining").textContent =
        budget - totalSpent;


    const list =
        document.getElementById("expenseList");


    list.innerHTML = "";


    expenses.forEach(
        function(expense, index) {

            const item =
                document.createElement("li");


            item.innerHTML =
                expense.category +
                " - Rs. " +
                expense.amount +
                ' <button onclick="deleteExpense(' +
                index +
                ')">Delete</button>';


            list.appendChild(item);

        }
    );


    showSuggestion();

    updateGoal();

    updateChart();

}


document.getElementById("budget").value =
    budget || "";


document.getElementById("savingsGoal").value =
    savingsGoal || "";


updateScreen();

</script>

</body>
</html>
