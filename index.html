<!DOCTYPE html>
<html>
<head>
    <title>AI Budget Buddy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>AI Budget Buddy</h1>

    <p>Smartly manage your daily expenses, budget and savings.</p>

    <h2>Daily Expense Tracker</h2>

    <label>Expense:</label>
    <input type="number" placeholder="Enter amount">

    <br><br>

    <label>Category:</label>
    <input type="text" placeholder="Food, Travel, etc.">

    <br><br>

    <button>Add Expense</button>

    <h2>My Budget</h2>
    <p>Track your spending and improve your savings.</p>

</body>
</html>
