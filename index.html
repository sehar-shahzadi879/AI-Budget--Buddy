<!DOCTYPE html>
<html>
<head>
    <title>AI Budget Buddy</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

<h1>💰 AI Budget Buddy</h1>

<p class="subtitle">
Smartly manage your daily expenses, budget and savings.
</p>

<div class="card">

<h2>My Budget</h2>

<input type="number" id="budget" placeholder="Enter your budget">

<button onclick="setBudget()">Set Budget</button>

<p>Budget: <strong>Rs. <span id="budgetAmount">0</span></strong></p>

<p>Spent: <strong>Rs. <span id="totalSpent">0</span></strong></p>

<p>Remaining: <strong>Rs. <span id="remaining">0</span></strong></p>

<h3 id="budgetAlert"></h3>

</div>


<div class="card">

<h2>🎯 Savings Goal</h2>

<input type="number" id="savingsGoal" placeholder="Enter savings goal">

<button onclick="setSavingsGoal()">Set Savings Goal</button>

<p id="goalMessage">No savings goal set yet.</p>

</div>


<div class="card">

<h2>Daily Expense Tracker</h2>

<input type="number" id="expense" placeholder="Enter amount">

<input type="text" id="category" placeholder="Food, Travel, Books">

<button onclick="addExpense()">Add Expense</button>

<h3>My Expenses</h3>

<ul id="expenseList"></ul>

<p id="suggestion"></p>

</div>


<div class="card">

<h2>📊 Expense Chart</h2>

<canvas id="expenseChart"></canvas>

</div>

</div>


<script>

let budget = Number(localStorage.getItem("budget")) || 0;

let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

let savingsGoal = Number(localStorage.getItem("savingsGoal")) || 0;

let expenseChart = null;


function saveData() {

    localStorage.setItem("budget", budget);

    localStorage.setItem("expenses", JSON.stringify(expenses));

    localStorage.setItem("savingsGoal", savingsGoal);

}


function setBudget() {

    let value = Number(document.getElementById("budget").value);

    if (value <= 0) {

        alert("Please enter a valid budget.");

        return;

    }

    budget = value;

    saveData();

    updateScreen();

}


function setSavingsGoal() {

    let value = Number(document.getElementById("savingsGoal").value);

    if (value <= 0) {

        alert("Please enter a valid savings goal.");

        return;

    }

    savingsGoal = value;

    saveData();

    updateScreen();

}


function addExpense() {

    let amount = Number(document.getElementById("expense").value);

    let category = document.getElementById("category").value.trim();

    if (amount <= 0 || category === "") {

        alert("Please enter expense amount and category.");

        return;

    }

    expenses.push({

        amount: amount,

        category: category

    });

    saveData();

    document.getElementById("expense").value = "";

    document.getElementById("category").value = "";

    updateScreen();

}


function deleteExpense(index) {

    expenses.splice(index, 1);

    saveData();

    updateScreen();

}


function updateScreen() {

    document.getElementById("budgetAmount").textContent = budget;


    let totalSpent = 0;

    expenses.forEach(function(expense) {

        totalSpent += expense.amount;

    });


    document.getElementById("totalSpent").textContent = totalSpent;


    let remaining = budget - totalSpent;

    document.getElementById("remaining").textContent = remaining;


    // BUDGET ALERT

    let alertBox = document.getElementById("budgetAlert");

    if (budget <= 0) {

        alertBox.textContent = "💰 Please set your budget.";

    }

    else {

        let percentage = (totalSpent / budget) * 100;

        if (percentage > 100) {

            alertBox.textContent =
            "🚨 Budget exceeded! Please reduce your spending.";

        }

        else if (percentage >= 80) {

            alertBox.textContent =
            "⚠️ Warning! You have used " +
            Math.round(percentage) +
            "% of your budget.";

        }

        else {

            alertBox.textContent =
            "✅ You're on track! You have used " +
            Math.round(percentage) +
            "% of your budget.";

        }

    }


    // EXPENSE LIST

    let list = document.getElementById("expenseList");

    list.innerHTML = "";


    expenses.forEach(function(expense, index) {

        let item = document.createElement("li");

        item.innerHTML =
        expense.category +
        " - Rs. " +
        expense.amount +
        ' <button onclick="deleteExpense(' +
        index +
        ')">Delete</button>';

        list.appendChild(item);

    });


    // SMART SUGGESTION

    if (budget <= 0) {

        document.getElementById("suggestion").textContent =
        "💡 Set a budget to get smart saving suggestions.";

    }

    else if (remaining < 0) {

        document.getElementById("suggestion").textContent =
        "⚠️ You have exceeded your budget. Try to reduce unnecessary expenses.";

    }

    else {

        document.getElementById("suggestion").textContent =
        "💡 You have Rs. " +
        remaining +
        " remaining. Keep saving!";

    }


    // SAVINGS GOAL

    if (savingsGoal <= 0) {

        document.getElementById("goalMessage").textContent =
        "No savings goal set yet.";

    }

    else if (remaining >= savingsGoal) {

        document.getElementById("goalMessage").textContent =
        "🎉 Great! You can reach your savings goal of Rs. " +
        savingsGoal +
        ".";

    }

    else {

        document.getElementById("goalMessage").textContent =
        "🎯 Savings Goal: Rs. " +
        savingsGoal +
        ". You need more savings to reach it.";

    }


    updateChart();

}


function updateChart() {

    let totals = {};


    expenses.forEach(function(expense) {

        if (totals[expense.category]) {

            totals[expense.category] += expense.amount;

        }

        else {

            totals[expense.category] = expense.amount;

        }

    });


    let labels = Object.keys(totals);

    let data = Object.values(totals);


    let ctx = document.getElementById("expenseChart");


    if (expenseChart) {

        expenseChart.destroy();

    }


    if (labels.length === 0) {

        return;

    }


    expenseChart = new Chart(ctx, {

        type: "doughnut",

        data: {

            labels: labels,

            datasets: [{

                data: data

            }]

        },

        options: {

            responsive: true

        }

    });

}


document.getElementById("budget").value = budget || "";

document.getElementById("savingsGoal").value = savingsGoal || "";

updateScreen();

</script>

</body>
</html>
